---
open_webui_image: ghcr.io/open-webui/open-webui:main
open_webui_port: 3000
# Publish the port on the host, bound to open_webui_bind_address. Follows ai_clients_external_access when
# that is set; this variable overrides it for this role. Containers on the ai network reach it by
# name regardless.
open_webui_external_access: "{{ ai_clients_external_access | default(true) | bool }}"
# Host address the port binds to when external access is on. Set to 0.0.0.0 to serve the LAN.
open_webui_bind_address: 127.0.0.1
open_webui_data_dir: "{{ ai_root | default('/srv/ai') }}/open-webui"
open_webui_ollama_url: http://ollama:11434

# Strata's OpenAI-compatible API, shown beside the Ollama models. The key is read from the file the
# strata role writes; if the file does not exist the connection is left out.
open_webui_strata_url: "http://strata:{{ strata_port | default(8080) }}/v1"
open_webui_strata_api_key_file: "{{ ai_root | default('/srv/ai') }}/strata-api-key"

# Image generation through ComfyUI, using Open WebUI's built-in text-to-image workflow. The node ids
# in the mapping refer to that workflow (6 and 7 are the prompts, 4 the checkpoint, 5 the latent
# size, 3 the sampler).
open_webui_comfyui_url: "http://comfyui:{{ comfyui_port | default(8188) }}"
open_webui_image_model: sd_xl_base_1.0.safetensors
open_webui_image_size: 1024x1024
open_webui_image_steps: 30
open_webui_comfyui_nodes:
  - {type: prompt, node_ids: ["6"], key: text}
  - {type: negative_prompt, node_ids: ["7"], key: text}
  - {type: model, node_ids: ["4"], key: ckpt_name}
  - {type: width, node_ids: ["5"], key: width}
  - {type: height, node_ids: ["5"], key: height}
  - {type: n, node_ids: ["5"], key: batch_size}
  - {type: steps, node_ids: ["3"], key: steps}
  - {type: seed, node_ids: ["3"], key: seed}

# Shares the ai_network default with ollama so the two can reach each other by name.
open_webui_network: "{{ ai_network | default('ai') }}"
open_webui_compose_dir: "{{ ai_root | default('/srv/ai') }}/compose/open-webui"
