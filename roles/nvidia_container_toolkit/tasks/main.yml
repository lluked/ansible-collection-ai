---
- name: Add NVIDIA container toolkit repo
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: deb
    uris: "{{ nvidia_ctk_repo_uri }}"
    suites: "/"
    signed_by: "{{ nvidia_ctk_repo_key }}"

- name: Install NVIDIA container toolkit
  ansible.builtin.apt:
    update_cache: true
    name: nvidia-container-toolkit
    state: present

- name: Configure Docker to use the NVIDIA runtime
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  register: nvidia_ctk_configure
  changed_when: nvidia_ctk_configure.rc == 0

- name: Restart Docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
