---
- name: Add NVIDIA container toolkit repo
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: deb
    uris: "{{ nvidia_container_toolkit_repo_uri }}"
    suites: "/"
    signed_by: "{{ nvidia_container_toolkit_repo_key }}"

- name: Install NVIDIA container toolkit
  ansible.builtin.apt:
    update_cache: true
    name: nvidia-container-toolkit
    state: present

- name: Check whether Docker already has the NVIDIA runtime configured
  ansible.builtin.command: grep -q '"nvidia"' /etc/docker/daemon.json
  register: nvidia_runtime_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: Configure Docker to use the NVIDIA runtime
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when: nvidia_runtime_check.rc != 0
  changed_when: true
  notify: Restart Docker

- name: Restart Docker now if the runtime was configured
  ansible.builtin.meta: flush_handlers
