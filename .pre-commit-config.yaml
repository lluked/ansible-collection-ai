---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: templates/
  - repo: https://github.com/ansible/ansible-lint
    rev: v25.1.3
    hooks:
      - id: ansible-lint
        additional_dependencies:
          - ansible-core>=2.15,<2.19
  - repo: local
    hooks:
      - id: galaxy-import-check
        name: galaxy import check
        entry: _pre_commit_hooks/galaxy-import-check.sh
        language: python
        additional_dependencies:
          - galaxy-importer
          - ansible-core>=2.15,<2.19
        pass_filenames: false
        always_run: true
